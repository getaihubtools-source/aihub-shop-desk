:root{--bg:#f4f7fb;--card:#fff;--ink:#0e1a2b;--muted:#5d6c82;--line:#e2e8f1;--pri:#0b7a72;--pri-ink:#fff;--pri-soft:#e0f3f0;--acc:#c98a1b;--danger:#c93a3a;--ok:#12803f;--warn:#a85a0a;--field:#fff;--shadow:0 1px 2px rgba(15,30,60,.05),0 10px 30px rgba(15,30,60,.07);--r:14px;--ch-pos:#0f9488;--ch-neg:#d4561a;--logo:linear-gradient(135deg,#14b8a6,#0b5f6b);--glow:radial-gradient(900px 420px at 85% -120px,rgba(20,184,166,.10),transparent 70%);--fabsh:0 8px 22px rgba(11,122,114,.40);--navon:0 4px 14px rgba(11,122,114,.28)}
:root[data-theme=dark]{--bg:#0a0e17;--card:#121826;--ink:#e9eef8;--muted:#94a1ba;--line:#222d44;--pri:#3ddcc0;--pri-ink:#041f1b;--pri-soft:#12303a;--acc:#f2bd57;--danger:#ff8f87;--ok:#47d98c;--warn:#f6bd62;--field:#0d1320;--shadow:0 1px 0 rgba(255,255,255,.04) inset,0 12px 32px rgba(0,0,0,.45);--ch-pos:#2fc4aa;--ch-neg:#f5894a;--logo:linear-gradient(135deg,#3ddcc0,#2a7fd0);--glow:radial-gradient(900px 460px at 85% -140px,rgba(61,220,192,.13),transparent 70%),radial-gradient(700px 400px at 0% 0%,rgba(80,120,255,.08),transparent 70%);--fabsh:0 8px 24px rgba(61,220,192,.30);--navon:0 4px 16px rgba(61,220,192,.22)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:15px}
body{font-family:Vazirmatn,"Segoe UI",Tahoma,"Noto Naskh Arabic",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--card);border-inline-end:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--logo);display:grid;place-items:center;color:#fff;font-weight:800}
.brand b{display:block;font-size:1.05rem;line-height:1.2}.brand small{color:var(--muted);font-size:.75rem}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--muted);text-decoration:none;font-weight:600}
.nav a:hover{background:var(--pri-soft);color:var(--ink)}
.nav a.on{background:var(--pri);color:var(--pri-ink)}
.nav svg{width:20px;height:20px;flex:none}
.side .sp{flex:1}
.main{padding:26px 30px 90px;max-width:1180px;width:100%}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h1{font-size:1.4rem}
.top .sub{color:var(--muted);font-size:.85rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);padding:9px 16px;border-radius:11px;font-weight:600;display:inline-flex;align-items:center;gap:7px;min-height:42px}
.btn:hover{border-color:var(--pri)}
.btn.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;min-height:34px;font-size:.85rem}
.btn svg{width:18px;height:18px}
.ibtn{border:1px solid var(--line);background:var(--card);width:34px;height:34px;border-radius:9px;display:inline-grid;place-items:center}
.ibtn:hover{border-color:var(--pri);color:var(--pri)}.ibtn.danger:hover{border-color:var(--danger);color:var(--danger)}
.ibtn svg{width:17px;height:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.gk{grid-template-columns:repeat(3,1fr)}
.kpi small{color:var(--muted);display:block;font-size:.8rem}
.kpi b{font-size:1.45rem;display:block;margin-top:2px}
.kpi i{font-style:normal;font-size:.75rem;color:var(--muted)}
h2{font-size:1.02rem;margin-bottom:10px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters input,.filters select{min-width:150px}
input,select,textarea{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;min-height:42px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri);outline-offset:-1px;border-color:var(--pri)}
textarea{min-height:70px;resize:vertical}
.filters input{width:auto;flex:1}.filters select{width:auto}
label.f{display:block;font-size:.82rem;color:var(--muted);margin-bottom:4px;font-weight:600}
.fg{margin-bottom:12px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:10px 9px;text-align:start;border-bottom:1px solid var(--line);font-size:.9rem;white-space:nowrap}
th{background:var(--pri-soft);font-size:.8rem;color:var(--muted)}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in srgb,var(--pri-soft) 40%,transparent)}
td.wrap{white-space:normal;min-width:130px}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.78rem;font-weight:700;background:color-mix(in srgb,var(--c,#64748b) 15%,transparent);color:var(--c,#64748b)}
select.stsel{width:auto;min-height:32px;padding:3px 8px;border-radius:99px;font-size:.8rem;font-weight:700;background:color-mix(in srgb,var(--c) 14%,var(--field));color:var(--c);border-color:color-mix(in srgb,var(--c) 40%,transparent)}
.muted{color:var(--muted)}.num{font-variant-numeric:tabular-nums}
.low{color:var(--warn);font-weight:700}.out{color:var(--danger);font-weight:700}
.pager{display:flex;gap:6px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.pg{min-width:36px;height:36px;border:1px solid var(--line);background:var(--card);border-radius:9px}
.pg.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}.pg:disabled{opacity:.4;cursor:default}
.gap{align-self:center;color:var(--muted)}
.empty{text-align:center;padding:42px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.warnbox{background:color-mix(in srgb,var(--acc) 18%,var(--card));border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);border-radius:var(--r);padding:12px 16px;margin-bottom:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.list li{list-style:none;display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.9rem;align-items:center}
.list li:last-child{border:0}
.list a{color:inherit;text-decoration:none;cursor:pointer}
.mback{position:fixed;inset:0;background:rgba(5,15,13,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow-y:auto;z-index:50}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .15s ease-out}
.modal.wide{max-width:820px}
@keyframes pop{from{transform:translateY(10px);opacity:0}}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.mh h3{font-size:1.05rem}
.mb{padding:18px 20px}
.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.irow{display:grid;grid-template-columns:2.2fr 1.4fr .7fr 1.1fr auto auto;gap:8px;align-items:center;margin-bottom:8px}
.irow .rt{font-weight:700;font-size:.85rem;white-space:nowrap;min-width:78px;text-align:end}
.vrow{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;margin-bottom:8px}
.sum{background:var(--pri-soft);border-radius:12px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:1.1rem;margin-top:10px}
.tl{border-inline-start:2px solid var(--line);padding-inline-start:14px;margin-inline-start:6px}
.tl div{position:relative;padding:3px 0;font-size:.85rem}
.tl div::before{content:"";position:absolute;inset-inline-start:-21px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--pri)}
#toast-root{position:fixed;bottom:84px;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;pointer-events:none}
.toast{background:#14201e;color:#fff;padding:10px 18px;border-radius:12px;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:92vw;animation:pop .15s}
.toast.err{background:var(--danger);color:#fff}

  function cal(jy) {
    let gy = jy + 621, leapJ = -14, jp = br[0], jm, jump = 0, i;
    for (i = 1; i < br.length; i++) { jm = br[i]; jump = jm - jp; if (jy < jm) break; leapJ += div(jump, 33) * 8 + div(mod(jump, 33), 4); jp = jm; }
    let n = jy - jp;
    leapJ += div(n, 33) * 8 + div(mod(n, 33) + 3, 4);
    if (mod(jump, 33) === 4 && jump - n === 4) leapJ++;
    const leapG = div(gy, 4) - div((div(gy, 100) + 1) * 3, 4) - 150, march = 20 + leapJ - leapG;
    if (jump - n < 6) n = n - jump + div(jump + 4, 33) * 33;
    let leap = mod(mod(n + 1, 33) - 1, 4); if (leap === -1) leap = 4;
    return { leap, gy, march };
  }
  const g2d = (gy, gm, gd) => { let d = div((gy + div(gm - 8, 6) + 100100) * 1461, 4) + div(153 * mod(gm + 9, 12) + 2, 5) + gd - 34840408; return d - div(div(gy + 100100 + div(gm - 8, 6), 100) * 3, 4) + 752; };
  const d2g = jdn => { let j = 4 * jdn + 139361631; j += div(div(4 * jdn + 183187720, 146097) * 3, 4) * 4 - 3908; const i = div(mod(j, 1461), 4) * 5 + 308; const gd = div(mod(i, 153), 5) + 1, gm = mod(div(i, 153), 12) + 1, gy = div(j, 1461) - 100100 + div(8 - gm, 6); return { gy, gm, gd }; };
  const j2d = (jy, jm, jd) => { const r = cal(jy); return g2d(r.gy, 3, r.march) + (jm - 1) * 31 - div(jm, 7) * (jm - 7) + jd - 1; };
  const d2j = jdn => { const g = d2g(jdn); let jy = g.gy - 621; const r = cal(jy), f = g2d(g.gy, 3, r.march); let k = jdn - f, jm, jd;
    if (k >= 0) { if (k <= 185) return { jy, jm: 1 + div(k, 31), jd: mod(k, 31) + 1 }; k -= 186; } else { jy--; k += 179; if (r.leap === 1) k++; }
    return { jy, jm: 7 + div(k, 30), jd: mod(k, 30) + 1 }; };
  const pad = n => String(n).padStart(2, '0');
  const months = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
  const api = {
    months,
    toJ: iso => { const [y, m, d] = iso.slice(0, 10).split('-').map(Number); return d2j(g2d(y, m, d)); },
    toISO: (jy, jm, jd) => { const g = d2g(j2d(jy, jm, jd)); return `${g.gy}-${pad(g.gm)}-${pad(g.gd)}`; },
    monthLen: (jy, jm) => jm <= 6 ? 31 : jm <= 11 ? 30 : (cal(jy).leap === 0 ? 30 : 29),
    todayISO: () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; },
    fmt: iso => { if (!iso) return '—'; const j = api.toJ(iso); return fa(`${j.jy}/${pad(j.jm)}/${pad(j.jd)}`); },
    fmtLong: iso => { if (!iso) return '—'; const j = api.toJ(iso); return fa(`${j.jd} ${months[j.jm - 1]} ${j.jy}`); },
    addDays: (iso, n) => { const [y, m, d] = iso.split('-').map(Number); const dt = new Date(y, m - 1, d + n); return `${dt.getFullYear()}-${pad(dt.getMonth() + 1)}-${pad(dt.getDate())}`; },
    daysBetween: (a, b) => { const p = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); }; return Math.round((p(b) - p(a)) / 864e5); }
  };
  return api;
})();

/* ---------- Storage Adapter (swap this layer for REST/cloud later) ---------- */
const Store = {
  stores: ['customers', 'products', 'orders', 'payments', 'expenses', 'meta'], db: null, mem: null, volatile: false,
  async init() {
    try {
      this.db = await new Promise((res, rej) => {
        this.dbName = LICENSE_PUBKEY ? 'aihub-shop-desk-sale' : 'aihub-shop-desk'; /* sale build never shares data with the dev/test build */
        const r = indexedDB.open(this.dbName, 2);
        r.onupgradeneeded = () => { this.stores.forEach(s => { if (!r.result.objectStoreNames.contains(s)) r.result.createObjectStore(s, { keyPath: 'id' }); }); };
        r.onsuccess = () => { r.result.onversionchange = () => r.result.close(); res(r.result); }; r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('blocked'));
      });
    } catch (e) { this.db = null; this.volatile = true; this.blocked = !!(e && e.message === 'blocked'); this.mem = {}; this.stores.forEach(s => this.mem[s] = new Map()); }
  },
  persisted: null,
  /* ask the browser not to evict our data under storage pressure (best effort; result shown in Settings) */
  async keep() {
    try { if (navigator.storage && navigator.storage.persisted) { this.persisted = await navigator.storage.persisted(); if (!this.persisted && navigator.storage.persist) this.persisted = await navigator.storage.persist(); } } catch (e) { this.persisted = null; }
  },
  _tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); let out;
      const r = fn(t.objectStore(store)); if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
    });
  },
  getAll(s) { return this.db ? this._tx(s, 'readonly', st => st.getAll()) : Promise.resolve([...this.mem[s].values()]); },
  put(s, o) { return this.bulkPut(s, [o]); },
  bulkPut(s, arr) {
    if (!arr.length) return Promise.resolve();
    if (!this.db) { arr.forEach(o => this.mem[s].set(o.id, structuredClone(o))); return Promise.resolve(); }
    return this._tx(s, 'readwrite', st => { arr.forEach(o => st.put(o)); });
  },
  del(s, id) { return this.db ? this._tx(s, 'readwrite', st => { st.delete(id); }) : (this.mem[s].delete(id), Promise.resolve()); },
  clear(s) { return this.db ? this._tx(s, 'readwrite', st => { st.clear(); }) : (this.mem[s].clear(), Promise.resolve()); }
};

/* ---------- Multi-tab safety: serialize writes + re-read from DB before each mutation ---------- */
const Sync = {
  q: Promise.resolve(), skip: false, bc: null, id: Math.random().toString(36).slice(2),
  init() {
    try { this.bc = new BroadcastChannel('sd-sync:' + Store.dbName); this.bc.onmessage = e => { if (e.data && e.data.from !== Sync.id) Sync.refresh(); }; } catch (e) { this.bc = null; }
  },
  notify() { try { this.bc && this.bc.postMessage({ from: this.id }); } catch (e) { /* ignore */ } },
  /* one write at a time: in-tab queue + cross-tab Web Lock (falls back to the queue alone if Locks API is missing) */
  exclusive(fn) {
    const job = () => (navigator.locks && navigator.locks.request ? navigator.locks.request('sd-write:' + Store.dbName, fn) : fn());
    const run = Sync.q.catch(() => {}).then(job); Sync.q = run.catch(() => {}); return run;
  },
  async refresh() {
    await Sync.exclusive(async () => { await loadAll(); });
    if (typeof Lock !== 'undefined' && Lock.unlocked && typeof render === 'function' && !document.querySelector('#modal-root > *')) render();
  },
  wrap(obj, names) {
    obj.raw = {};
    names.forEach(n => {
      const fn = obj[n]; obj.raw[n] = fn;
      obj[n] = function (...a) {
        if (Sync.skip) return fn.apply(obj, a);
        return Sync.exclusive(async () => { await loadAll(); const r = await fn.apply(obj, a); Sync.notify(); return r; });
      };
    });
  }
};

const Products = {
  get: id => S.products.find(p => p.id === id),
  stockOf: p => p.variants.reduce((a, v) => a + v.stock, 0),
  isLow: p => { const t = Products.stockOf(p); return t > 0 && t <= p.lowAt; },
  isOut: p => Products.stockOf(p) <= 0,
  async save(d) {
    const name = (d.name || '').trim(); if (!name) fail('نام محصول را وارد کنید');
    if (d.buyPrice < 0 || d.sellPrice < 0) fail('قیمت نمی‌تواند منفی باشد');
    if (!d.variants.length) fail('حداقل یک تنوع (یا «بدون تنوع») لازم است');
    const seen = new Set();
    for (const v of d.variants) { if (!Number.isInteger(v.stock) || v.stock < 0) fail('موجودی هر تنوع باید عدد صحیح و نامنفی باشد'); const k = v.label.trim(); if (seen.has(k)) fail('نام تنوع‌ها نباید تکراری باشد'); seen.add(k); }
    if (S.products.some(p => p.id !== d.id && p.name.trim() === name && !p.archived)) fail('محصولی با این نام قبلاً ثبت شده است');
    let p = d.id && Products.get(d.id);
    if (p) {
      const keepIds = new Set(d.variants.map(v => v.id).filter(Boolean));
      for (const v of p.variants) if (!keepIds.has(v.id) && S.orders.some(o => o.items.some(i => i.productId === p.id && i.variantId === v.id))) fail(`تنوع «${v.label || 'بدون تنوع'}» در سفارش‌ها استفاده شده و قابل حذف نیست؛ به‌جای حذف، موجودی آن را صفر کنید`);
    }
    if (!p) { p = { id: uid(), createdAt: Date.now(), archived: false }; S.products.push(p); }
    Object.assign(p, { name, category: (d.category || '').trim(), buyPrice: d.buyPrice, sellPrice: d.sellPrice, lowAt: d.lowAt, variants: d.variants.map(v => ({ id: v.id || uid(), label: v.label.trim(), stock: v.stock })) });
    await Store.put('products', p); return p;
  },
  async remove(id) {
    if (S.orders.some(o => o.items.some(i => i.productId === id))) fail('این محصول در سفارش‌ها استفاده شده؛ به‌جای حذف، آن را بایگانی کنید');
    S.products = S.products.filter(p => p.id !== id); await Store.del('products', id);
  },
  async toggleArchive(id) { const p = Products.get(id); p.archived = !p.archived; await Store.put('products', p); }
};

const Customers = {
  get: id => S.customers.find(c => c.id === id),
  byPhone: ph => { const d = digitsOnly(ph); return d ? S.customers.find(c => digitsOnly(c.phone) === d) : null; },
  async save(d) {
    const name = (d.name || '').trim(); if (!name) fail('نام مشتری را وارد کنید');
    const phone = digitsOnly(d.phone || '');
    if (phone && !/^0?9\d{9}$|^0\d{10}$|^\d{8,12}$/.test(phone)) fail('شماره تلفن معتبر نیست');
    const dup = phone && S.customers.find(c => c.id !== d.id && digitsOnly(c.phone) === phone);
    if (dup) fail(`این شماره قبلاً برای «${dup.name}» ثبت شده است`);
    let c = d.id && Customers.get(d.id);
    if (!c) { c = { id: uid(), createdAt: Date.now() }; S.customers.push(c); }
    Object.assign(c, { name, phone, instagram: (d.instagram || '').trim().replace(/^@/, ''), city: (d.city || '').trim(), address: (d.address || '').trim(), note: (d.note || '').trim() });
    await Store.put('customers', c); return c;
  },
  async remove(id) { if (S.orders.some(o => o.customerId === id)) fail('این مشتری سفارش دارد و قابل حذف نیست'); S.customers = S.customers.filter(c => c.id !== id); await Store.del('customers', id); },
  stats(id) {
    const os = S.orders.filter(o => o.customerId === id), ok = os.filter(o => Orders.counts(o.status));
    return { orders: os.length, valid: ok.length, total: ok.reduce((a, o) => a + o.total, 0), due: ok.reduce((a, o) => a + Math.max(0, Payments.due(o)), 0), last: os.reduce((a, o) => o.date > a ? o.date : a, '') };
  }
};

const Orders = {
  get: id => S.orders.find(o => o.id === id),
  consumes: st => st !== 'cancelled' && st !== 'returned',
  counts: st => st !== 'cancelled' && st !== 'returned',
  calc(items, discount, shipping) { const sub = items.reduce((a, i) => a + i.qty * i.price, 0); return { sub, total: Math.max(0, sub - discount + shipping) }; },
  _keyMap(items) { const m = new Map(); items.forEach(i => { const k = i.productId + '|' + i.variantId; m.set(k, (m.get(k) || 0) + i.qty); }); return m; },
  _validate(d, old) {
    if (!Customers.get(d.customerId)) fail('مشتری انتخاب نشده است');
    if (!d.items.length) fail('حداقل یک کالا به سفارش اضافه کنید');
    d.items.forEach(i => {
      if (!i.productId) fail('برای همه ردیف‌ها کالا انتخاب کنید');
      if (!Number.isInteger(i.qty) || i.qty < 1) fail('تعداد باید عدد صحیح و حداقل ۱ باشد');
      if (i.price < 0) fail('قیمت نامعتبر است');
    });
    if (d.discount < 0 || d.shipping < 0) fail('تخفیف و هزینه ارسال نمی‌تواند منفی باشد');
    const { sub } = Orders.calc(d.items, 0, 0); if (d.discount > sub) fail('تخفیف بیشتر از مبلغ کالاهاست');
    if (!ST[d.status]) fail('وضعیت نامعتبر است');
    if (Orders.consumes(d.status)) {
      const need = Orders._keyMap(d.items), back = old && Orders.consumes(old.status) ? Orders._keyMap(old.items) : new Map();
      for (const [k, q] of need) {
        const [pid, vid] = k.split('|'), p = Products.get(pid); if (!p) continue;
        const v = p.variants.find(x => x.id === vid); if (!v) continue;
        const avail = v.stock + (back.get(k) || 0);
        if (q > avail) fail(`موجودی «${p.name}${v.label ? ' - ' + v.label : ''}» کافی نیست (موجودی: ${fa(avail)})`);
      }
    }
  },
  async _stock(items, sign) {
    const touched = new Set();
    items.forEach(i => { const p = Products.get(i.productId), v = p && p.variants.find(x => x.id === i.variantId); if (v) { v.stock += sign * i.qty; touched.add(p); } });
    await Store.bulkPut('products', [...touched]);
  },
  _clean(d) {
    return { customerId: d.customerId, date: d.date, source: d.source || 'other', status: d.status || 'new', discount: d.discount || 0, shipping: d.shipping || 0,
      trackingCode: (d.trackingCode || '').trim(), shipMethod: d.shipMethod || '', note: (d.note || '').trim(),
      items: d.items.map(i => ({ productId: i.productId, variantId: i.variantId, name: i.name, variantLabel: i.variantLabel || '', qty: i.qty, price: i.price, cost: i.cost || 0 })) };
  },
  async create(raw) {
    if (!License.bypass && !License.canAdd()) fail(LIMIT_MSG);
    const d = Orders._clean(raw); Orders._validate(d, null);
    const o = Object.assign({ id: uid(), no: ++S.settings.orderNo, createdAt: Date.now(), history: [{ status: d.status, at: Date.now() }] }, d, Orders.calc(d.items, d.discount, d.shipping));
    if (Orders.consumes(o.status)) await Orders._stock(o.items, -1);
    S.orders.push(o); await Store.put('orders', o); await License.mark(true); await saveSettings(); return o;
  },
  async update(id, raw) {
    const o = Orders.get(id), d = Orders._clean(raw); Orders._validate(d, o);
    if (Orders.counts(d.status) && Orders.calc(d.items, d.discount, d.shipping).total < Payments.paid(o.id)) fail('مبلغ جدید کمتر از پرداخت‌های ثبت‌شده است؛ ابتدا «بازگشت وجه» ثبت کنید');
    if (Orders.consumes(o.status)) await Orders._stock(o.items, +1);
    if (Orders.consumes(d.status)) await Orders._stock(d.items, -1);
    if (d.status !== o.status) o.history.push({ status: d.status, at: Date.now() });
    Object.assign(o, d, Orders.calc(d.items, d.discount, d.shipping), { updatedAt: Date.now() });
    await Store.put('orders', o); return o;
  },
  async setStatus(id, status) {
    const o = Orders.get(id); if (o.status === status) return o;
    if (!ST[status]) fail('وضعیت نامعتبر است');
    const was = Orders.consumes(o.status), will = Orders.consumes(status);
    if (!was && will) {
      Orders._validate(Object.assign({}, o, { status }), null);
      if (o.total < Payments.paid(o.id)) fail('پرداخت‌های ثبت‌شده بیشتر از مبلغ سفارش است؛ ابتدا «بازگشت وجه» ثبت کنید');
    }
    if (was && !will) await Orders._stock(o.items, +1);
    if (!was && will) await Orders._stock(o.items, -1);
    o.status = status; o.history.push({ status, at: Date.now() }); o.updatedAt = Date.now();
    await Store.put('orders', o); return o;
  },
  async remove(id) {
    const o = Orders.get(id); if (Orders.consumes(o.status)) await Orders._stock(o.items, +1);
    const ps = S.payments.filter(p => p.orderId === id); S.payments = S.payments.filter(p => p.orderId !== id);
    for (const p of ps) await Store.del('payments', p.id);
    const linked = S.expenses.filter(e => e.orderId === id); linked.forEach(e => { e.orderId = ''; }); await Store.bulkPut('expenses', linked);
    S.orders = S.orders.filter(x => x.id !== id); await Store.del('orders', id);
  }
};

/* ---------- Payments / Expenses / Finance ---------- */
const METHODS = { card: 'کارت‌به‌کارت', cash: 'نقدی', cod: 'پرداخت در محل', deposit: 'بیعانه', refund: 'بازگشت وجه' };
const EXP_CATS = { ads: 'تبلیغات', shipping: 'ارسال و پست', packaging: 'بسته‌بندی', other: 'سایر' };
const EXP_COLORS = { ads: '#2563eb', shipping: '#7c3aed', packaging: '#b45309', other: '#64748b' };
const ISO_RE = /^\d{4}-\d\d-\d\d$/;

const Payments = {
  forOrder: id => S.payments.filter(p => p.orderId === id).sort((a, b) => a.date.localeCompare(b.date) || a.createdAt - b.createdAt),
  paid: id => S.payments.reduce((a, p) => p.orderId === id ? a + p.amount : a, 0),
  due: o => o.total - Payments.paid(o.id),
  state(o) {
    if (!Orders.counts(o.status)) return 'void';
    if (o.total <= 0) return 'paid';
    const p = Payments.paid(o.id); return p <= 0 ? 'unpaid' : p < o.total ? 'partial' : 'paid';
  },
  async add(d) {
    const o = Orders.get(d.orderId); if (!o) fail('سفارش پیدا نشد');
    if (!METHODS[d.method]) fail('روش پرداخت نامعتبر است');
    const amt = Math.round(d.amount); if (!(amt > 0)) fail('مبلغ باید بیشتر از صفر باشد');
    if (!ISO_RE.test(d.date || '')) fail('تاریخ نامعتبر است');
    const paid = Payments.paid(o.id);
    if (d.method === 'refund') { if (amt > paid) fail(`بازگشت وجه نمی‌تواند بیشتر از مبلغ دریافتی (${money(paid)}) باشد`); }
    else {
      if (!Orders.counts(o.status)) fail('این سفارش لغو/مرجوع شده است؛ فقط «بازگشت وجه» ثبت می‌شود');
      const due = o.total - paid; if (amt > due) fail(`مبلغ بیشتر از مانده‌ی سفارش است (مانده: ${money(Math.max(0, due))})`);
    }
    const p = { id: uid(), orderId: o.id, amount: d.method === 'refund' ? -amt : amt, method: d.method, date: d.date, note: (d.note || '').trim(), createdAt: Date.now() };
    S.payments.push(p); await Store.put('payments', p);
    let advanced = false;
    if (o.status === 'new' && o.total > 0 && Payments.due(o) <= 0) { await Orders.raw.setStatus(o.id, 'paid'); advanced = true; }
    return { payment: p, advanced };
  },
  async remove(id) {
    const p = S.payments.find(x => x.id === id); if (!p) return;
    const after = Payments.paid(p.orderId) - p.amount; if (after < 0) fail('ابتدا بازگشت وجه‌های این سفارش را حذف کنید');
    S.payments = S.payments.filter(x => x.id !== id); await Store.del('payments', id);
  }
};

const Expenses = {

/* Profit = revenue (non-cancelled/returned orders, by order date, incl. shipping charged)
          − cost of goods (cost snapshot × qty) − expenses (by expense date). */
const Fin = {
  inMonth: (iso, jy, jm) => { const j = J.toJ(iso); return j.jy === jy && j.jm === jm; },
  month(jy, jm) {
    const os = S.orders.filter(o => Orders.counts(o.status) && Fin.inMonth(o.date, jy, jm));
    const revenue = os.reduce((a, o) => a + o.total, 0);
    const cogs = os.reduce((a, o) => a + o.items.reduce((x, i) => x + i.qty * (i.cost || 0), 0), 0);
    const ex = S.expenses.filter(e => Fin.inMonth(e.date, jy, jm)), expenses = ex.reduce((a, e) => a + e.amount, 0);
    const byCat = {}; Object.keys(EXP_CATS).forEach(k => { byCat[k] = 0; }); ex.forEach(e => { byCat[e.category] = (byCat[e.category] || 0) + e.amount; });
    const cash = S.payments.filter(p => Fin.inMonth(p.date, jy, jm)).reduce((a, p) => a + p.amount, 0), net = revenue - cogs - expenses;
    return { orders: os.length, revenue, cogs, gross: revenue - cogs, expenses, byCat, net, margin: revenue > 0 ? net / revenue * 100 : 0, cash, noCost: os.reduce((a, o) => a + o.items.filter(i => !(i.cost > 0)).length, 0) };
  },
  receivables() { const list = S.orders.filter(o => Orders.counts(o.status)).map(o => ({ o, due: Payments.due(o) })).filter(x => x.due > 0); return { total: list.reduce((a, x) => a + x.due, 0), list }; },
  prevMonths(jy, jm, n) { const out = []; let y = jy, m = jm; for (let i = 0; i < n; i++) { out.push({ jy: y, jm: m }); m--; if (m < 1) { m = 12; y--; } } return out; }
};

/* ---------- Reporting (READ-ONLY): same definitions as Fin.month, evaluated over any date range ----------
   revenue/COGS/orders: by ORDER date, excluding cancelled/returned | expenses: by EXPENSE date | cash: by PAYMENT date */
const Rpt = {
  PRESETS: [['today', 'امروز'], ['month', 'ماه جاری'], ['lastmonth', 'ماه گذشته'], ['custom', 'بازه‌ی دلخواه']],
  resolve(r) {
    const t = J.todayISO(), tj = J.toJ(t);
    if (r.preset === 'today') return { from: t, to: t };
    if (r.preset === 'month') return { from: J.toISO(tj.jy, tj.jm, 1), to: t };
    if (r.preset === 'lastmonth') { const pm = tj.jm === 1 ? { jy: tj.jy - 1, jm: 12 } : { jy: tj.jy, jm: tj.jm - 1 }; return { from: J.toISO(pm.jy, pm.jm, 1), to: J.toISO(pm.jy, pm.jm, J.monthLen(pm.jy, pm.jm)) }; }
    if (r.preset === 'custom' && ISO_RE.test(r.from || '') && ISO_RE.test(r.to || '') && r.from <= r.to) return { from: r.from, to: r.to };
    return { from: J.toISO(tj.jy, tj.jm, 1), to: t };
  },
  days: p => J.daysBetween(p.from, p.to) + 1,
  prev(p) { const n = Rpt.days(p); return { from: J.addDays(p.from, -n), to: J.addDays(p.from, -1) }; },
  orders: (from, to) => S.orders.filter(o => Orders.counts(o.status) && o.date >= from && o.date <= to),
  summary(from, to) {
    const os = Rpt.orders(from, to), revenue = os.reduce((a, o) => a + o.total, 0);
    let cogs = 0, noCost = 0; os.forEach(o => o.items.forEach(i => { cogs += i.qty * (i.cost || 0); if (!(i.cost > 0)) noCost++; }));
    const expenses = S.expenses.filter(e => e.date >= from && e.date <= to).reduce((a, e) => a + e.amount, 0);
    const cash = S.payments.filter(p => p.date >= from && p.date <= to).reduce((a, p) => a + p.amount, 0);
    const byCat = {}; Object.keys(EXP_CATS).forEach(k => { byCat[k] = 0; }); S.expenses.forEach(e => { if (e.date >= from && e.date <= to) byCat[e.category] = (byCat[e.category] || 0) + e.amount; });
    return { byCat, orders: os.length, revenue, cogs, gross: revenue - cogs, expenses, net: revenue - cogs - expenses, avg: os.length ? revenue / os.length : null, margin: revenue > 0 ? (revenue - cogs - expenses) / revenue * 100 : null, cash, noCost };
  },
  series(from, to) {
    const n = Rpt.days({ from, to }), step = n <= 45 ? 1 : n <= 200 ? 7 : 30, mode = step === 1 ? 'day' : step === 7 ? 'week' : 'span', rows = [];
    for (let k = 0; k < n; k += step) rows.push({ date: J.addDays(from, k), to: J.addDays(from, Math.min(k + step - 1, n - 1)), revenue: 0, orders: 0 });
    Rpt.orders(from, to).forEach(o => { const r = rows[Math.floor(J.daysBetween(from, o.date) / step)]; if (r) { r.revenue += o.total; r.orders++; } });
    return { mode, rows, title: mode === 'day' ? 'فروش روزانه' : mode === 'week' ? 'فروش هفتگی' : 'فروش ۳۰‌روزه' };
  },
  byProduct(from, to) {
    const m = new Map();
    Rpt.orders(from, to).forEach(o => o.items.forEach(i => {
      const p = Products.get(i.productId), r = m.get(i.productId) || { id: i.productId, name: (p && p.name) || i.name || '—', cat: (p && p.category) || '', qty: 0, revenue: 0, cogs: 0, noCost: 0, oset: new Set() };
      r.qty += i.qty; r.revenue += i.qty * i.price; r.cogs += i.qty * (i.cost || 0); if (!(i.cost > 0)) r.noCost++; r.oset.add(o.id); m.set(i.productId, r);
    }));
    return [...m.values()].map(r => { const known = r.noCost === 0; return { id: r.id, name: r.name, cat: r.cat, qty: r.qty, orders: r.oset.size, revenue: r.revenue, cogs: known ? r.cogs : null, known, profit: known ? r.revenue - r.cogs : null, margin: known && r.revenue > 0 ? (r.revenue - r.cogs) / r.revenue * 100 : null }; });
  },
  byChannel(from, to) {
    const m = {}, os = Rpt.orders(from, to), total = os.reduce((a, o) => a + o.total, 0);
    os.forEach(o => { const r = m[o.source] || (m[o.source] = { key: o.source, orders: 0, revenue: 0, cogs: 0, noCost: 0 }); r.orders++; r.revenue += o.total; o.items.forEach(i => { r.cogs += i.qty * (i.cost || 0); if (!(i.cost > 0)) r.noCost++; }); });
    return Object.values(m).map(r => { const known = r.noCost === 0; return { key: r.key, name: SOURCES[r.key] || r.key, orders: r.orders, revenue: r.revenue, share: total > 0 ? r.revenue / total * 100 : null, avg: r.revenue / r.orders, cogs: known ? r.cogs : null, known, gross: known ? r.revenue - r.cogs : null, margin: known && r.revenue > 0 ? (r.revenue - r.cogs) / r.revenue * 100 : null }; });
  }
};

const Intel = {
  valid: () => S.orders.filter(o => Orders.counts(o.status)),
  between: (from, to) => Intel.valid().filter(o => o.date >= from && o.date <= to),
  sum: os => os.reduce((a, o) => a + o.total, 0),
  window30() { const t = J.todayISO(); return Intel.between(J.addDays(t, -29), t); },
  daily(n) {
    const t = J.todayISO(), map = new Map();

    return Array.from({ length: n }, (_, k) => { const d = J.addDays(t, -(n - 1 - k)); return Object.assign({ date: d, revenue: 0, orders: 0 }, map.get(d)); });
  },
  /* month-to-date vs the same span of the previous Jalali month */
  mtd() {
    const t = J.todayISO(), tj = J.toJ(t), pm = tj.jm === 1 ? { jy: tj.jy - 1, jm: 12 } : { jy: tj.jy, jm: tj.jm - 1 };
    const cur = Intel.between(J.toISO(tj.jy, tj.jm, 1), t), prev = Intel.between(J.toISO(pm.jy, pm.jm, 1), J.toISO(pm.jy, pm.jm, Math.min(tj.jd, J.monthLen(pm.jy, pm.jm))));

  },
  bySource(os) { const m = {}; os.forEach(o => { const r = m[o.source] || (m[o.source] = { revenue: 0, orders: 0 }); r.revenue += o.total; r.orders++; }); return Object.entries(m).map(([key, v]) => ({ key, revenue: v.revenue, orders: v.orders })).sort((a, b) => b.revenue - a.revenue); },
  topProducts(os, n) {

    os.forEach(o => o.items.forEach(i => { const r = m.get(i.productId) || { name: i.name, qty: 0, revenue: 0, profit: 0 }; r.qty += i.qty; r.revenue += i.qty * i.price; r.profit += i.qty * (i.price - (i.cost || 0)); m.set(i.productId, r); }));

  repeatRate(os) {

    add('unpaid_old', valid.filter(o => Payments.due(o) > 0 && age(o) >= 7).sort(byAge).map(o => oi(o, `مانده ${money(Payments.due(o))} | ${fa(age(o))} روز`)));

    const w1 = Intel.between(J.addDays(t, -6), t), w0 = Intel.between(J.addDays(t, -13), J.addDays(t, -7)), r1 = Intel.sum(w1), r0 = Intel.sum(w0);

  },
  summary() {

    const rec = Fin.receivables(), low = S.products.filter(p => !p.archived && (Products.isLow(p) || Products.isOut(p))).length, lost = Intel.lostCustomers().length;
    if (toShip) rows.push({ n: toShip, text: 'سفارش منتظر ارسال است', go: { v: 'orders', status: 'toship' } });

  }

function openModal(html, wide) {

  w.addEventListener('mousedown', e => { if (e.target === w) closeModal(w); });

/* Jalali date field: a button that opens a calendar (month & year are navigable). The value lives in data-v (ISO). */
const WDAYS = ['شنبه', 'یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنجشنبه', 'جمعه'];
const wdOf = iso => { const [y, m, d] = iso.split('-').map(Number); return (new Date(y, m - 1, d).getDay() + 1) % 7; };
const dpText = iso => `${WDAYS[wdOf(iso)]} ${J.fmtLong(iso)}`;
function dateSel(id, iso) {
  return `<div class="dpick" data-dsel="${id}" data-v="${iso}"><button type="button" class="dbtn" data-a="dp-open" aria-haspopup="dialog">${ic('cal')}<span>${dpText(iso)}</span></button></div>`;
}
function readDate(id) { return $(`[data-dsel="${id}"]`).dataset.v; }
function pickDate(iso) {
  return new Promise(res => {
    const cur = J.toJ(iso), td = J.todayISO(), tj = J.toJ(td), MINY = 1380, MAXY = 1460;
    let jy = cur.jy, jm = cur.jm, mode = 'days', yb = Math.max(MINY, Math.min(MAXY - 11, jy - 5));
    const w = openModal('<div class="calbox"></div>'), box = $('.calbox', w); w.firstElementChild.classList.add('calm');
    const fin = v => { w.remove(); res(v); }; w.addEventListener('mclose', () => res(null));
    const nav = (prev, mid, next) => `<div class="ch"><button type="button" class="ibtn" data-n="-1" aria-label="${prev}">›</button><div class="cmy">${mid}</div><button type="button" class="ibtn" data-n="1" aria-label="${next}">‹</button></div>`;
    const draw = () => {
      let h;
      if (mode === 'days') {
        const len = J.monthLen(jy, jm), first = wdOf(J.toISO(jy, jm, 1)); let cells = '<span></span>'.repeat(first);
        for (let d = 1; d <= len; d++) { const v = J.toISO(jy, jm, d), k = (first + d - 1) % 7; cells += `<button type="button" class="cd${k === 6 ? ' fri' : ''}${v === td ? ' tod' : ''}${v === iso ? ' sel' : ''}" data-d="${d}">${fa(d)}</button>`; }
        h = nav('ماه قبل', `<button type="button" data-m="months">${J.months[jm - 1]}</button><button type="button" data-m="years">${fa(jy)}</button>`, 'ماه بعد') + `<div class="cwd">${['ش', 'ی', 'د', 'س', 'چ', 'پ', 'ج'].map(x => `<span>${x}</span>`).join('')}</div><div class="cg">${cells}</div>`;
      } else if (mode === 'months') {
        h = nav('سال قبل', `<button type="button" data-m="years">${fa(jy)}</button>`, 'سال بعد') + `<div class="cg3">${J.months.map((n, i) => `<button type="button" class="${i + 1 === jm && jy === cur.jy ? 'sel' : ''}${jy === tj.jy && i + 1 === tj.jm ? ' tod' : ''}" data-mo="${i + 1}">${n}</button>`).join('')}</div>`;
      } else {
        let ys = ''; for (let y = yb; y < yb + 12; y++) ys += `<button type="button" class="${y === cur.jy ? 'sel' : ''}${y === tj.jy ? ' tod' : ''}" data-yr="${y}">${fa(y)}</button>`;
        h = nav('۱۲ سال قبل', `<span class="cyr">${fa(yb)} تا ${fa(yb + 11)}</span>`, '۱۲ سال بعد') + `<div class="cg3">${ys}</div>`;
      }
      box.innerHTML = h + `<div class="cf"><button type="button" class="btn sm" data-t="1">امروز</button><button type="button" class="btn sm" data-x="1">انصراف</button></div>`;
    };
    box.addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return; const D = b.dataset;
      if (D.n) { const n = +D.n; if (mode === 'days') { jm += n; if (jm > 12) { jm = 1; jy++; } if (jm < 1) { jm = 12; jy--; } jy = Math.max(MINY, Math.min(MAXY, jy)); } else if (mode === 'months') jy = Math.max(MINY, Math.min(MAXY, jy + n)); else yb = Math.max(MINY, Math.min(MAXY - 11, yb + 12 * n)); draw(); }
      else if (D.m) { mode = D.m; if (mode === 'years') yb = Math.max(MINY, Math.min(MAXY - 11, jy - 5)); draw(); }
      else if (D.d) fin(J.toISO(jy, jm, +D.d));
      else if (D.mo) { jm = +D.mo; mode = 'days'; draw(); }
      else if (D.yr) { jy = +D.yr; mode = 'months'; draw(); }
      else if (D.t) fin(td);
      else if (D.x) fin(null);
    });
    draw(); setTimeout(() => { const t = $('.cd.sel, .cd.tod', box); if (t) t.focus(); }, 30);
  });
}

function pager(total, page, per, key) {
  const pages = Math.max(1, Math.ceil(total / per)); if (pages <= 1) return '';
  const ps = [...new Set([1, pages, page - 1, page, page + 1])].filter(p => p >= 1 && p <= pages).sort((a, b) => a - b);
  let h = '', prev = 0; ps.forEach(p => { if (p - prev > 1) h += '<span class="gap">…</span>'; h += `<button class="pg ${p === page ? 'on' : ''}" data-a="page" data-k="${key}" data-p="${p}">${fa(p)}</button>`; prev = p; });
  return `<div class="pager"><button class="pg" data-a="page" data-k="${key}" data-p="${page - 1}" ${page <= 1 ? 'disabled' : ''}>›</button>${h}<button class="pg" data-a="page" data-k="${key}" data-p="${page + 1}" ${page >= pages ? 'disabled' : ''}>‹</button></div>`;
}

function variantOptions(it) {

function ofTotals(w) {

function orderForm(order) {

    <div class="two" style="margin-top:14px"><div class="fg"><label class="f">تاریخ سفارش</label>${dateSel('od', o ? o.date : today)}</div><div class="fg"><label class="f">وضعیت</label><select id="o-status">${STATUSES.map(s => `<option value="${s[0]}" ${(o ? o.status : 'new') === s[0] ? 'selected' : ''}>${s[1]}</option>`).join('')}</select></div></div>

  matchCust();
  $('#o-cust', w).addEventListener('input', matchCust);
  const rerender = () => { $('#items', w).innerHTML = itemRows(); ofTotals(w); };
  w.addEventListener('click', e => {

   Phase 5 — safety (encrypted backup, undo snapshot) | app lock | light license | help
   ============================================================ */
const CR = {
  ok: !!(window.crypto && crypto.subtle),
  b64(buf) { const u = new Uint8Array(buf); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); },
  unb64: s => Uint8Array.from(atob(s), c => c.charCodeAt(0)),
  b64u(buf) { return CR.b64(buf).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  unb64u(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return CR.unb64(s); },
  rand: n => crypto.getRandomValues(new Uint8Array(n)),
  pw: p => nd(p),
  async kdf(pass, salt, iter, aes) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(CR.pw(pass)), 'PBKDF2', false, ['deriveBits', 'deriveKey']), p = { name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' };
    return aes ? crypto.subtle.deriveKey(p, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']) : crypto.subtle.deriveBits(p, base, 256);
  },
  same(a, b) { if (a.length !== b.length) return false; let d = 0; for (let i = 0; i < a.length; i++) d |= a.charCodeAt(i) ^ b.charCodeAt(i); return d === 0; },
  async seal(obj, pass) {
    const salt = CR.rand(16), iv = CR.rand(12), iter = 200000, key = await CR.kdf(pass, salt, iter, true), ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, new TextEncoder().encode(JSON.stringify(obj)));
    return { app: 'aihub-shop-desk', enc: 1, schema: obj.schema, kdf: 'PBKDF2-SHA256', iter, salt: CR.b64(salt), iv: CR.b64(iv), data: CR.b64(ct), exportedAt: new Date().toISOString() };
  },
  async open(env, pass) {
    if (!Number.isInteger(env.iter) || env.iter < 1000 || env.iter > 1000000) fail('فایل پشتیبان نامعتبر است (پارامتر رمزنگاری خارج از محدوده)');
    try { const key = await CR.kdf(pass, CR.unb64(env.salt), env.iter, true), pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: CR.unb64(env.iv) }, key, CR.unb64(env.data)); return JSON.parse(new TextDecoder().decode(pt)); }
    catch (e) { fail('رمز اشتباه است یا فایل پشتیبان خراب شده'); }
  }
};

/* ---------- App lock (a screen gate, not database encryption — the UI says so) ---------- */
const Lock = {
  unlocked: true, last: Date.now(), timer: null,
  on: () => !!S.settings.lock,
  hash: async (pass, saltB64, iter) => CR.b64(await CR.kdf(pass, CR.unb64(saltB64), iter, false)),
  newCode() { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', r = CR.rand(10); const c = [...r].map(x => A[x % A.length]).join(''); return c.slice(0, 5) + '-' + c.slice(5); },
  normCode: c => nd(c).toUpperCase().replace(/[^A-Z0-9]/g, ''),
  async set(pass) {
    const salt = CR.b64(CR.rand(16)), rsalt = CR.b64(CR.rand(16)), code = Lock.newCode(), iter = 150000, old = S.settings.lock || {};
    S.settings.lock = { salt, iter, hash: await Lock.hash(pass, salt, iter), rsalt, rhash: await Lock.hash(Lock.normCode(code), rsalt, iter), idle: old.idle ?? 10, fails: 0, until: 0 };
    await saveSettings(); return code;
  },
  async newRecovery() { const L = S.settings.lock, code = Lock.newCode(); L.rsalt = CR.b64(CR.rand(16)); L.rhash = await Lock.hash(Lock.normCode(code), L.rsalt, L.iter); await saveSettings(); return code; },
  async _try(secret, which) {

    if (wait > 0) fail(`تعداد تلاش‌های اشتباه زیاد بود؛ ${fa(wait)} ثانیه دیگر دوباره امتحان کنید`);

/* ---------- Light license: ECDSA-signed string, verified offline; trial = limited real orders (never limits data access/export) ---------- */
const LICENSE_PUBKEY = "{\"kty\":\"EC\",\"crv\":\"P-256\",\"x\":\"Z1h4bXXQFoyes14VbtZwWjxWYEqd2UTtaO40jL8-Irk\",\"y\":\"QF5uZVrptPDephAC8bEKJtXH0OWcXb8dtYieWBtJB-U\"}";
const TRIAL_ORDERS = 20;
const LIMIT_MSG = `نسخه‌ی آزمایشی تا ${fa(TRIAL_ORDERS)} سفارش واقعی را ثبت می‌کند. برای ادامه، مجوز را فعال کنید. اطلاعات، پشتیبان‌گیری و خروجی‌ها همیشه در دسترس شما می‌مانند.`;
const License = {
  /* a malformed key or one that contains private (“d”) material is never trusted: the build then simply stays in trial mode */
  pub: (() => { if (!LICENSE_PUBKEY) return null; try { const k = JSON.parse(LICENSE_PUBKEY); return k && typeof k === 'object' && !('d' in k) ? k : {}; } catch (e) { return {}; } })(), info: null, mismatch: null, bypass: false,
  /* time that cannot be rolled back by changing the device clock (highest time ever seen on this device; absurd forward jumps are not recorded) */
  now: () => Math.max(Date.now(), (S.trial && S.trial.ls) || 0),
  today: () => new Date(License.now()).toISOString().slice(0, 10),
  addDays: (iso, n) => new Date(Date.parse(iso + 'T00:00:00Z') + n * 864e5).toISOString().slice(0, 10),
  /* device code: random per installation (kept in the trial doc + localStorage, never in backups). A v:2 code carries it in the signed field dv and works only where it matches. */
  devRe: /^[A-HJ-KM-NP-Z2-9]{8}$/,
  genDev() { const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', b = crypto.getRandomValues(new Uint8Array(8)); return [...b].map(x => A[x % 31]).join(''); },
  dev: () => (S.trial && S.trial.dev) || '',
  devFmt() { const d = License.dev(); return d ? d.slice(0, 4) + '-' + d.slice(4) : ''; },
  async ensureDev() {
    const ok = x => License.devRe.test(x || ''); let ls = ''; try { ls = localStorage.getItem('sd_dev') || ''; } catch (e) { /* storage may be blocked */ }
    let id = S.trial.dev; if (!ok(id)) id = ok(ls) ? ls : License.genDev();
    if (id !== S.trial.dev) { S.trial.dev = id; await Store.put('meta', S.trial); }
    if (id !== ls) { try { localStorage.setItem('sd_dev', id); } catch (e) { /* ignore */ } }
  },
  sigKey: str => String(str || '').trim().split('.')[2].slice(0, 24),
  /* signed fields: v=1, n=buyer, t=issue date; optional x=fixed expiry date, d=validity in days counted from first activation on this device, b=last day the code may be activated */
  startOf: () => (License.info && License.info.d && S.settings.license && S.trial.act[License.sigKey(S.settings.license)]) || null,
  exp: () => { const i = License.info; if (!i) return null; const c = []; if (i.x) c.push(i.x); if (i.d) { const st = License.startOf(); if (st) c.push(License.addDays(st, i.d)); } return c.sort()[0] || null; },
  expired: () => { const x = License.exp(); return !!x && License.today() > x; },
  mode() { return !License.pub ? 'dev' : License.info ? (License.expired() ? 'expired' : 'licensed') : 'trial'; },
  limited: () => { const m = License.mode(); return m === 'trial' || m === 'expired'; },
  /* orders ever created in trial counting: deleting orders / restoring / wiping can never lower it */
  used: () => Math.max((S.trial && S.trial.n) || 0, S.orders.filter(o => !o.demo).length),
  canAdd() { return !License.limited() || License.used() < TRIAL_ORDERS; },
  async mark(count) {
    if (License.bypass || !License.pub) return;
    if (count) S.trial.n = Math.max((S.trial.n || 0) + 1, S.orders.filter(o => !o.demo).length);
    const now = Date.now(); if (!S.trial.ls || (now > S.trial.ls && now - S.trial.ls < 400 * 864e5)) S.trial.ls = Math.max(S.trial.ls || 0, now);

  },
  async verify(str) {
    try {
      if (!License.pub || !CR.ok) return null; const p = String(str || '').trim().split('.'); if (p.length !== 3 || p[0] !== 'AHSD1') return null;
      const key = await crypto.subtle.importKey('jwk', License.pub, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']), body = CR.unb64u(p[1]);
      if (!(await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, CR.unb64u(p[2]), body))) return null;

      if (d.v === 2 ? !(typeof d.dv === 'string' && License.devRe.test(d.dv)) : d.dv !== undefined) return null;
      if ((d.x !== undefined && !dt(d.x)) || (d.b !== undefined && !dt(d.b)) || (d.d !== undefined && !(Number.isInteger(d.d) && d.d >= 1 && d.d <= 3660)) || (d.x !== undefined && d.d !== undefined)) return null;
      return d;
    } catch (e) { return null; }
  },
  async check() {
    await License.ensureDev();

    if (License.info && License.info.d && !License.startOf()) { S.trial.act[License.sigKey(S.settings.license)] = License.today(); await License.mark(false); return; }

  },
  async activate(str) {

    await saveSettings(); await License.mark(false); return d;
  }
};
